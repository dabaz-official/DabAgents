# Copy to .github/workflows/ci.yml.
# npm projects: keep the trigger and concurrency, drop pnpm/action-setup, use
# setup-node's npm cache, and let `check` run `npm run` scripts instead of pnpm.
#
# The gate is the project's own `pnpm check`; the shared workflow only installs
# and runs it, so nothing here restates what the gate is.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    uses: dabaz-official/.github/.github/workflows/web-ci.yml@main
